
# --- TP 13 (ajouté à la fin de /etc/haproxy/haproxy.cfg) ---
frontend tp13-web
    bind 192.168.120.10:80
    # Adresse du client ajoutée en dernier dans X-Forwarded-For (l'appli lit la dernière valeur)
    option forwardfor
    # Adresse d'entrée de HAProxy, affichée par l'appli ; remplace toute valeur envoyée par le client
    http-request set-header X-Tp13-Frontend %[dst]:%[dst_port]
    default_backend tp13-appli

backend tp13-appli
    server appli 127.0.0.1:8080 check
